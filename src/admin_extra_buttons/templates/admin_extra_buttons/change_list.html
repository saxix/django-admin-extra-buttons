{% extends "admin/change_list.html" %}
{% load i18n admin_urls static %}

{% block object-tools-items %}
  {{ block.super }}
  {% for button in custom_buttons %}
    <li>
      <a href="{% url button.url_name %}"
         class="{{ button.html_attrs.class|default:'historylink' }}"
         title="{{ button.html_attrs.title|default:button.func.__name__ }}">
          {{ button.html_attrs.title|default:button.func.__name__ }}
      </a>
    </li>
  {% endfor %}
{% endblock %}
